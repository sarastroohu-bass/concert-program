<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<!-- ✅ 확대 안정 + 크로스 브라우저 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Memoirs of a Bass</title>

<style>
:root{
--bg:#000;
--card:#121212;
--accent:#c5a059;
--text:#fff;
--sub:#aaa;
}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:'Noto Serif KR', serif;
overflow:hidden;
touch-action: pan-y;
}

/* 슬라이더 */
.slider{
display:flex;
height:100vh;
will-change: transform;
transition:transform .45s ease;
}

/* 슬라이드 */
.slide{
width:100vw;
min-height:100vh;
padding:30px 20px 80px;
box-sizing:border-box;
}

/* 타이포 */
h1{font-size:2rem;}
h2{
color:var(--accent);
border-bottom:1px solid var(--accent);
display:inline-block;
margin-bottom:20px;
}
p{white-space:pre-line; line-height:1.8;}

/* 카드 */
.card{
background:var(--card);
padding:18px;
border-radius:14px;
margin-top:15px;
}

/* 가사 */
.toggle{
color:var(--accent);
cursor:pointer;
margin-top:10px;
}

.lyrics{
display:none;
background:#080808;
padding:15px;
border-left:2px solid var(--accent);
margin-top:10px;
}

/* 화살표 */
.arrow{
position:fixed;
top:50%;
transform:translateY(-50%);
font-size:26px;
color:var(--accent);
background:rgba(0,0,0,0.4);
width:44px;
height:44px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
cursor:pointer;
z-index:10;
}

.left{left:10px;}
.right{right:10px;}

/* 하단 */
.nav{
position:fixed;
bottom:0;
width:100%;
text-align:center;
padding:10px;
color:var(--sub);
font-size:.8rem;
border-top:1px solid #222;
background:#000;
}
</style>
</head>

<body>

<div class="slider" id="slider">

<!-- 기존 내용 그대로 유지 -->

</div>

<div class="arrow left" onclick="prev()">‹</div>
<div class="arrow right" onclick="next()">›</div>

<div class="nav" id="indicator"></div>

<script>
let index=0;
const slider=document.getElementById("slider");
const slides=document.querySelectorAll(".slide");
const total=slides.length;
const indicator=document.getElementById("indicator");

slider.style.width = total * 100 + "vw";

function update(){
slider.style.transform=`translateX(-${index*100}vw)`;
indicator.innerText=`${index+1} / ${total}`;

document.querySelector('.left').style.opacity = index===0 ? 0.2 : 1;
document.querySelector('.right').style.opacity = index===total-1 ? 0.2 : 1;
}

function next(){ if(index<total-1){index++;update();}}
function prev(){ if(index>0){index--;update();}}

function toggle(el){
const l=el.nextElementSibling;
l.style.display = l.style.display==="block"?"none":"block";
}

/* 터치 */
let startX=0;
document.addEventListener("touchstart",e=>startX=e.touches[0].clientX);
document.addEventListener("touchend",e=>{
let diff=e.changedTouches[0].clientX-startX;
if(diff>50) prev();
if(diff<-50) next();
});

/* 드래그 */
let isDown=false;
let moved=false;

document.addEventListener("mousedown",e=>{
isDown=true;
startX=e.clientX;
moved=false;
});

document.addEventListener("mousemove",()=>{
if(isDown) moved=true;
});

document.addEventListener("mouseup",e=>{
if(!isDown || !moved) return;

let diff=e.clientX-startX;
if(diff>80) prev();
if(diff<-80) next();

isDown=false;
});

/* 키보드 */
document.addEventListener("keydown",e=>{
if(e.key==="ArrowRight") next();
if(e.key==="ArrowLeft") prev();
});

update();
</script>

</body>
</html>
